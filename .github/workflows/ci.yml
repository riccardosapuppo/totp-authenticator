name: CI

on:
  push:

jobs:
  verify:
    runs-on: ubuntu-latest
    # A job that hangs is worse than one that fails: it stays amber for six
    # hours and nobody looks at it, while a red one sends an email. Learned
    # from a Windows job that sat in_progress for two hours after every one
    # of its checks had passed.
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
